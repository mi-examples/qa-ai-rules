name: Test

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: E2E Install Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and pack
        # tsc → dist/cli.js, then postbuild runs npm pack + rename-pack.js
        # which produces metricinsights-qa-ai-rules-latest.tgz
        run: npm run build

      - name: Run E2E tests
        run: npm test
